<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Smart Facility — 3D</title>
<style>
  body { margin:0; overflow:hidden; background:#0b1220;
         font:13px system-ui, sans-serif; color:#e2e8f0; }
  #hud { position:fixed; top:10px; left:12px; line-height:1.5;
         background:rgba(15,23,42,.72); padding:9px 12px; border-radius:8px; }
  #hud b { color:#93c5fd; }
  #controls { position:fixed; top:10px; right:12px;
              background:rgba(15,23,42,.72); padding:9px 12px; border-radius:8px; }
  button { background:#1e293b; color:#e2e8f0; border:1px solid #334155;
           border-radius:6px; padding:5px 10px; margin-left:4px; cursor:pointer; }
  button.on { background:#2563eb; border-color:#3b82f6; }
  #legend { position:fixed; bottom:10px; left:12px; opacity:.85;
            background:rgba(15,23,42,.72); padding:8px 11px; border-radius:8px; }
  .sw { display:inline-block; width:11px; height:11px; border-radius:2px;
        vertical-align:-1px; margin-right:5px; }
</style>
</head>
<body>
<div id="hud">connecting…</div>
<div id="controls">
  <span>Floors</span>
  <button id="b-all" class="on">All</button>
  <button id="b-f1">Ground</button>
  <button id="b-f2">First</button>
</div>
<div id="legend">
  <span class="sw" style="background:#2563eb"></span>at target
  <span class="sw" style="background:#ef4444;margin-left:12px"></span>hot
  <span class="sw" style="background:#f59e0b;margin-left:12px"></span>maintenance flagged
</div>

<script src="/room3d/vendor/mqtt.min.js"></script>
<script type="module">
import * as THREE from '/room3d/vendor/three.module.js';

const hudEl = document.getElementById('hud');
function fatal(what, err) {
  hudEl.innerHTML = `<b style="color:#f87171">${what}</b><br>` +
                    `<span style="opacity:.75">${err}</span>`;
  throw err;
}

// The SAME file the simulator and dashboard read. Fetching it rather than
// hardcoding geometry is what stops the picture drifting from the physics —
// including which furniture each room contains.
let layout;
try {
  const res = await fetch('/data/building_layout.json');
  if (!res.ok) throw new Error(`HTTP ${res.status} for the layout file`);
  layout = await res.json();
} catch (err) {
  // Without this the module dies silently and the page is simply blank, which
  // is the hardest kind of failure to diagnose from a dashboard iframe.
  fatal('Could not load data/building_layout.json', err.message);
}
if (typeof mqtt === 'undefined') {
  fatal('mqtt.min.js did not load', 'check /room3d/vendor/mqtt.min.js');
}

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0b1220, 45, 105);
const camera = new THREE.PerspectiveCamera(52, innerWidth/innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const sun = new THREE.DirectionalLight(0xffffff, 0.85);
sun.position.set(14, 30, 12); scene.add(sun);

const root = new THREE.Group(); scene.add(root);

const FLOOR_H = 7.0;
const ROOM_W = 12, ROOM_D = 10, CORRIDOR_D = 5.0;
const CORRIDOR_Z = ROOM_D / 2 + CORRIDOR_D / 2 + 0.4;
const DOOR_W = 2.8;

const cold = new THREE.Color(0x2563eb), hot = new THREE.Color(0xef4444);

// Shared geometry and materials — six rooms of furniture and up to ~60 people
// would be far too many unique allocations otherwise.
const M = {
  wall:    new THREE.MeshStandardMaterial({ color:0x94a3b8, transparent:true,
                                            opacity:0.13, roughness:0.2 }),
  corridor:new THREE.MeshStandardMaterial({ color:0x334155, roughness:0.85 }),
  frame:   new THREE.MeshStandardMaterial({ color:0x1e293b, roughness:0.5 }),
  top:     new THREE.MeshStandardMaterial({ color:0xe2e8f0, roughness:0.35 }),
  rack:    new THREE.MeshStandardMaterial({ color:0x0f172a, roughness:0.6 }),
  led:     new THREE.MeshBasicMaterial({ color:0x22d3ee }),
  screen:  new THREE.MeshStandardMaterial({ color:0x0ea5e9, roughness:0.2,
                                            emissive:0x0b4a6f }),
  chair:   new THREE.MeshStandardMaterial({ color:0x475569, roughness:0.7 }),
  unit:    new THREE.MeshStandardMaterial({ color:0xf1f5f9 }),
  blade:   new THREE.MeshStandardMaterial({ color:0x38bdf8 }),
  head:    new THREE.MeshStandardMaterial({ color:0xfde047, roughness:0.5 }),
};
const G = {
  legY:    new THREE.BoxGeometry(0.09, 0.75, 0.09),
  benchTop:new THREE.BoxGeometry(3.0, 0.09, 1.2),
  deskTop: new THREE.BoxGeometry(1.7, 0.08, 0.9),
  monitor: new THREE.BoxGeometry(0.9, 0.55, 0.05),
  rackBox: new THREE.BoxGeometry(0.9, 2.0, 1.1),
  rackLed: new THREE.BoxGeometry(0.7, 0.05, 0.02),
  meetTop: new THREE.BoxGeometry(4.4, 0.1, 1.8),
  chair:   new THREE.BoxGeometry(0.5, 0.1, 0.5),
  chairBack:new THREE.BoxGeometry(0.5, 0.55, 0.08),
  body:    new THREE.CapsuleGeometry(0.2, 0.6, 6, 10),
  head:    new THREE.SphereGeometry(0.19, 12, 12),
};
const PERSON_COLOURS = [0x38bdf8, 0xf43f5e, 0x10b981, 0xf59e0b, 0xa855f7, 0xec4899]
  .map(c => new THREE.MeshStandardMaterial({ color:c, roughness:0.45 }));

function legs(group, w, d) {
  [[-w/2+0.2,-d/2+0.2],[w/2-0.2,-d/2+0.2],[-w/2+0.2,d/2-0.2],[w/2-0.2,d/2-0.2]]
    .forEach(([dx,dz]) => {
      const leg = new THREE.Mesh(G.legY, M.frame);
      leg.position.set(dx, 0.375, dz); group.add(leg);
    });
}

// Furniture is chosen by the layout's `furniture` field, not by room name, so
// the scene stays data-driven and adding a room needs no code change here.
const FURNITURE = {
  lab_bench(group) {
    [[-3.0,-2.2],[3.0,-2.2],[-3.0,1.4],[3.0,1.4]].forEach(([x,z]) => {
      const bench = new THREE.Group();
      const top = new THREE.Mesh(G.benchTop, M.top);
      top.position.y = 0.79; bench.add(top);
      legs(bench, 3.0, 1.2);
      bench.position.set(x, 0.14, z); group.add(bench);
    });
  },
  desks(group) {
    for (let i = 0; i < 6; i++) {
      const desk = new THREE.Group();
      const top = new THREE.Mesh(G.deskTop, M.top);
      top.position.y = 0.76; desk.add(top);
      legs(desk, 1.7, 0.9);
      const mon = new THREE.Mesh(G.monitor, M.screen);
      mon.position.set(0, 1.09, -0.3); desk.add(mon);
      desk.position.set(-3.6 + (i % 3) * 3.6, 0.14, -2.2 + Math.floor(i / 3) * 3.4);
      group.add(desk);
    }
  },
  server_rack(group) {
    for (let i = 0; i < 6; i++) {
      const rack = new THREE.Mesh(G.rackBox, M.rack);
      rack.position.set(-3.5 + (i % 3) * 3.5, 1.14, -2.4 + Math.floor(i / 3) * 3.6);
      group.add(rack);
      for (let j = 0; j < 5; j++) {
        const led = new THREE.Mesh(G.rackLed, M.led);
        led.position.set(rack.position.x, 0.55 + j * 0.32, rack.position.z + 0.56);
        group.add(led);
      }
    }
  },
  meeting_table(group) {
    const table = new THREE.Group();
    const top = new THREE.Mesh(G.meetTop, M.top);
    top.position.y = 0.78; table.add(top);
    legs(table, 4.4, 1.8);
    table.position.set(0, 0.14, -0.4); group.add(table);
    for (let i = 0; i < 8; i++) {
      const side = i < 4 ? -1 : 1;
      const x = -1.65 + (i % 4) * 1.1;
      const chair = new THREE.Group();
      const seat = new THREE.Mesh(G.chair, M.chair);
      seat.position.y = 0.45; chair.add(seat);
      const back = new THREE.Mesh(G.chairBack, M.chair);
      back.position.set(0, 0.75, side * 0.22); chair.add(back);
      chair.position.set(x, 0.14, -0.4 + side * 1.6); group.add(chair);
    }
  },
};

const rooms = {};
const floorGroups = {};

layout.floors.forEach((floor, fi) => {
  const group = new THREE.Group();
  group.position.y = fi * FLOOR_H;
  floorGroups[floor.floor_id] = group;
  root.add(group);

  floor.rooms.forEach((r, ri) => {
    const rx = (ri - (floor.rooms.length - 1) / 2) * (ROOM_W + 0.8);
    const twinId = `${floor.floor_id}/${r.room_id}`;

    const roomGroup = new THREE.Group();
    roomGroup.position.set(rx, 0, 0);
    group.add(roomGroup);

    const floorMat = new THREE.MeshStandardMaterial({ color:0x2563eb, roughness:0.45 });
    const slab = new THREE.Mesh(new THREE.BoxGeometry(ROOM_W, 0.28, ROOM_D), floorMat);
    roomGroup.add(slab);

    // Back and side walls solid; the corridor-facing wall is split so there is
    // a real doorway for people to walk through.
    const seg = (w, d, x, z) => {
      const wall = new THREE.Mesh(new THREE.BoxGeometry(w, 2.6, d), M.wall);
      wall.position.set(x, 1.4, z); roomGroup.add(wall);
    };
    seg(ROOM_W, 0.12, 0, -ROOM_D/2);
    seg(0.12, ROOM_D, -ROOM_W/2, 0);
    seg(0.12, ROOM_D, ROOM_W/2, 0);
    const sideW = (ROOM_W - DOOR_W) / 2;
    seg(sideW, 0.12, -(DOOR_W/2 + sideW/2), ROOM_D/2);
    seg(sideW, 0.12,  (DOOR_W/2 + sideW/2), ROOM_D/2);

    (FURNITURE[r.furniture] || FURNITURE.desks)(roomGroup);

    const unit = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.22, 2.2), M.unit);
    unit.position.set(0, 2.75, 0); roomGroup.add(unit);
    const fan = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.06, 0.3), M.blade);
    fan.position.set(0, 2.6, 0); roomGroup.add(fan);

    const halo = new THREE.Mesh(
      new THREE.TorusGeometry(3.4, 0.14, 8, 40),
      new THREE.MeshBasicMaterial({ color:0xf59e0b, transparent:true, opacity:0.9 }));
    halo.rotation.x = -Math.PI/2; halo.position.y = 0.3;
    halo.visible = false; roomGroup.add(halo);

    rooms[twinId] = {
      floorMat, fan, halo, rx, group, people: [], nextId: 1,
      name: r.name, temp: 24, setpoint: 23, power: 0, occ: 0, risk: null,
    };
  });

  const corridor = new THREE.Mesh(
    new THREE.BoxGeometry(floor.rooms.length * (ROOM_W + 0.8), 0.28, CORRIDOR_D),
    M.corridor);
  corridor.position.set(0, 0, CORRIDOR_Z);
  group.add(corridor);
});

const stair = new THREE.Mesh(
  new THREE.BoxGeometry(2.6, FLOOR_H, 2.6),
  new THREE.MeshStandardMaterial({ color:0x475569, transparent:true, opacity:0.35 }));
stair.position.set(-17, FLOOR_H/2, CORRIDOR_Z);
root.add(stair);

// ── People who actually walk ────────────────────────────────────────────────
// Positions are in FLOOR-local coordinates (rooms sit at room.rx), so a person
// can walk from the shared corridor into their own room and back out again.

const MAX_VISIBLE = 8;      // per room, for legibility and frame rate

function spotInRoom(room) {
  return { x: room.rx + (Math.random() - 0.5) * 8.0,
           z: (Math.random() - 0.5) * 6.4 };
}
function spotInCorridor(room) {
  return { x: room.rx + (Math.random() - 0.5) * 7.0,
           z: CORRIDOR_Z + (Math.random() - 0.5) * 2.6 };
}
const doorway = room => ({ x: room.rx + (Math.random() - 0.5) * 1.6,
                           z: ROOM_D / 2 });

class Person {
  constructor(room, id, startInside) {
    this.room = room;
    this.id = id;
    this.speed = 1.5 + Math.random() * 0.7;
    this.group = new THREE.Group();

    const body = new THREE.Mesh(G.body, PERSON_COLOURS[id % PERSON_COLOURS.length]);
    body.position.y = 0.6;
    const head = new THREE.Mesh(G.head, M.head);
    head.position.y = 1.15;
    this.group.add(body, head);

    if (startInside) {
      const s = spotInRoom(room);
      this.group.position.set(s.x, 0, s.z);
      this.state = 'idle'; this.target = s; this.wait = Math.random() * 4;
    } else {
      const s = spotInCorridor(room);
      this.group.position.set(s.x, 0, s.z);
      this.state = 'entering'; this.target = doorway(room);
    }
    room.group.add(this.group);
  }

  leave() {
    if (this.state === 'leaving' || this.state === 'gone') return;
    this.state = 'leaving';
    this.target = doorway(this.room);
  }

  update(dt, t) {
    const p = this.group.position;
    const dx = this.target.x - p.x, dz = this.target.z - p.z;
    const dist = Math.hypot(dx, dz);

    if (dist > 0.1) {
      const step = Math.min(dist, this.speed * dt);
      p.x += dx / dist * step;
      p.z += dz / dist * step;
      this.group.rotation.y = Math.atan2(dx, dz);
      p.y = Math.abs(Math.sin(t * 9 + this.id)) * 0.07;   // walking bob
      return;
    }

    p.y = 0;
    if (this.state === 'entering') {
      this.state = 'idle'; this.target = spotInRoom(this.room);
      this.wait = Math.random() * 3 + 1;
    } else if (this.state === 'idle') {
      this.wait -= dt;
      if (this.wait <= 0) {
        this.target = spotInRoom(this.room);
        this.wait = Math.random() * 6 + 3;
      }
    } else if (this.state === 'leaving') {
      this.state = 'gone_soon';
      this.target = spotInCorridor(this.room);
    } else if (this.state === 'gone_soon') {
      this.state = 'gone';
    }
  }

  destroy() { this.room.group.remove(this.group); }
}

function syncPeople(room, target) {
  const visible = Math.min(target, MAX_VISIBLE);
  const staying = room.people.filter(p => p.state !== 'leaving'
                                       && p.state !== 'gone_soon'
                                       && p.state !== 'gone');
  if (staying.length < visible) {
    for (let i = staying.length; i < visible; i++) {
      // First render populates rooms instantly; later arrivals walk in.
      room.people.push(new Person(room, room.nextId++, room.seeded !== true));
    }
    room.seeded = true;
  } else if (staying.length > visible) {
    for (let i = staying.length - 1; i >= visible; i--) staying[i].leave();
  }
}

// ── Live data ───────────────────────────────────────────────────────────────
const hud = hudEl;
let messages = 0, buildingOcc = 0, load = null, simHour = null;

const client = mqtt.connect('ws://localhost:9001');
client.on('connect', () => client.subscribe('twin/#'));
client.on('close', () => hud.innerHTML = 'broker disconnected');
client.on('message', (topic, buf) => {
  messages++;
  const parts = topic.split('/');
  let data;
  try { data = JSON.parse(buf.toString()); } catch { return; }

  if (topic === 'twin/building/summary') {
    buildingOcc = data.occupancy; load = data.total_load_kw; simHour = data.sim_hour;
    return;
  }
  if (parts.length < 4) return;
  const room = rooms[`${parts[1]}/${parts[2]}`];
  if (!room) return;
  const leaf = parts.slice(3).join('/');

  if (leaf === 'temperature') room.temp = data.value;
  else if (leaf === 'occupancy') { room.occ = data.value; syncPeople(room, data.value); }
  else if (leaf === 'hvac/state') { room.power = data.ac_power_pct || 0;
                                    room.setpoint = data.setpoint ?? room.setpoint; }
  else if (leaf === 'health/risk') room.risk = data;
});

const clock = new THREE.Clock();
let angle = 0.6, autoOrbit = true, elapsed = 0;

renderer.domElement.addEventListener('pointerdown', () => autoOrbit = false);
renderer.domElement.addEventListener('pointermove', e => {
  if (e.buttons) angle += e.movementX * 0.005;
});
renderer.domElement.addEventListener('pointerup', () => autoOrbit = true);

function showFloors(which) {
  Object.entries(floorGroups).forEach(([id, g]) =>
    g.visible = (which === 'all' || which === id));
  stair.visible = which === 'all';
  ['all','f1','f2'].forEach(id =>
    document.getElementById('b-' + id).classList.toggle('on', id === which));
}
document.getElementById('b-all').onclick = () => showFloors('all');
document.getElementById('b-f1').onclick  = () => showFloors('f1');
document.getElementById('b-f2').onclick  = () => showFloors('f2');

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);
  elapsed += dt;
  if (autoOrbit) angle += dt * 0.1;
  camera.position.set(Math.cos(angle) * 38, 22, Math.sin(angle) * 38);
  camera.lookAt(0, FLOOR_H * 0.5, 2);

  let flagged = 0, hottest = null;
  const pulse = 0.55 + 0.45 * Math.sin(performance.now() / 260);

  for (const room of Object.values(rooms)) {
    // Blue at the setpoint, red 8 °C above it — relative, so a room is judged
    // against its own target rather than an absolute scale.
    const k = Math.min(Math.max((room.temp - room.setpoint) / 8, 0), 1);
    room.floorMat.color.copy(cold).lerp(hot, k);
    room.fan.rotation.y += dt * 14 * room.power;

    for (const person of room.people) person.update(dt, elapsed);
    const gone = room.people.filter(p => p.state === 'gone');
    if (gone.length) {
      gone.forEach(p => p.destroy());
      room.people = room.people.filter(p => p.state !== 'gone');
    }

    const alert = !!(room.risk && room.risk.alert);
    room.halo.visible = alert;
    if (alert) { room.halo.material.opacity = pulse; flagged++; }
    if (!hottest || room.temp > hottest.temp) hottest = room;
  }

  hud.innerHTML =
    `<b>${layout.building.name}</b><br>` +
    `${buildingOcc} people · ${load == null ? '—' : load.toFixed(1)} kW` +
    ` / ${layout.building.power_budget_kw} kW budget<br>` +
    `${simHour == null ? '' : 'sim ' + simHour.toFixed(1) + ':00 · '}` +
    `hottest ${hottest ? hottest.name + ' ' + hottest.temp.toFixed(1) + '°C' : '—'}<br>` +
    (flagged ? `<span style="color:#f59e0b">${flagged} room(s) flagged for maintenance</span>`
             : `<span style="color:#4ade80">no maintenance flags</span>`) +
    `<br><span style="opacity:.6">${messages} messages</span>`;

  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
