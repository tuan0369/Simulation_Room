# EXTERNAL DEPLOYMENT EXAMPLE — not used by the classroom default compose.
# TLS encrypts transport; username/password authentication and the ACL limit
# broker access. Replace the example certificate and password files before use.

allow_anonymous false
password_file /run/secrets/mosquitto_passwords
acl_file /mosquitto/config/acl.hardened

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

# Native MQTT over TLS.
listener 8883
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2

# MQTT over secure WebSockets (WSS).
listener 9002
protocol websockets
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2
